x-postgres-client: &postgres-client
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-shorter}
  PGUSER: ${POSTGRES_USER:-shorter}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте непустой POSTGRES_PASSWORD в .env или окружении}

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *postgres-client
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.19.1
    environment: *postgres-client
    volumes:
      - ./migrate:/migrations:ro

    entrypoint: ["migrate", "-path=/migrations", "-database=postgres://postgres:5432?sslmode=disable"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shorter}
      POSTGRES_USER: ${POSTGRES_USER:-shorter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте непустой POSTGRES_PASSWORD в .env или окружении}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
